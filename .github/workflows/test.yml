# What runs on every change, and what deliberately does not.
#
# The unit suite gates merges: it needs no network, no database and no secrets,
# so it can never fail for a reason unrelated to the diff. The smoke suite talks
# to SFU's server and runs on its own schedule.
#
# Two jobs touch Postgres, and the difference between them is the point.
#
# `migrations` runs against a sidecar container: no secret, no Neon branch, so
# it runs on every pull request including one from a fork, where secrets are
# withheld and the `database` job skips itself silently. It starts from an
# empty database, which is the path the other job structurally cannot take.
#
# `database` branches from production and re-runs every migration over a copy
# of the real schema and data, then exercises the app's own queries against the
# result. That needs the Neon key, and it is the only job that can notice
# production drifting away from db/migrations.

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit, types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Before tsc, not after: next build generates the route types in
      # .next/types that tsconfig includes, and app/layout.tsx uses one of them.
      - run: npm run build
        env:
          # The build only needs these to exist, not to be valid: nothing is
          # prerendered against a real database.
          DATABASE_URL: postgresql://user:pass@localhost/db
          AUTH_SECRET: build-only-not-a-real-secret
      - run: npx tsc --noEmit

  migrations:
    name: migrations (throwaway Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without this the job can connect before the server is accepting
        # connections, and the first migration fails for no reason at all.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Set here, so tests/migrations/setup.ts knows not to reach for Docker.
      - run: npm run test:migrations
        env:
          MIGRATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  database:
    name: database (Neon branch)
    runs-on: ubuntu-latest
    # Skips itself with a message when the secret is absent — which is what a
    # pull request from a fork gets, since secrets are not exposed to those.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
